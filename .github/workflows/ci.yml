name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
        # setup-python may lack 3.9 for arm64 macOS runners; 3.9 is still covered on Linux.
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: py_compile
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          for f in chat_server.py sidereus/*.py hooks/*.py mcp/*.py; do
            "$PYTHON" -m py_compile "$f"
          done

      - name: node --check
        run: |
          for f in web/*.js web/js/*.js; do
            node --check "$f"
          done

      - name: unit tests
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash tests/run.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    # Windows not yet verified; failures are reported, not blocking.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash    # Git Bash on the runner, so the steps match the Unix jobs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: py_compile
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          for f in chat_server.py sidereus/*.py hooks/*.py mcp/*.py; do
            "$PYTHON" -m py_compile "$f"
          done

      - name: node --check
        run: |
          for f in web/*.js web/js/*.js; do
            node --check "$f"
          done

      - name: unit tests
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash tests/run.sh

      - name: demo smoke test
        # Runs even when unit tests failed: it checks a different thing (the server starts and serves the page).
        if: success() || failure()
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          port=18799
          # ⚠ Output goes to a file: an orphan holding the step's stdout keeps a Windows step from finishing.
          "$PYTHON" -m sidereus start --demo --port "$port" > demo.log 2>&1 &
          pid=$!
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s --max-time 5 -o page.html -w '%{http_code}' "http://127.0.0.1:$port/" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          ok=0
          [ "$code" = "200" ] && grep -q '<title>Sidereus' page.html && ok=1
          # ⚠ The launcher spawns chat_server.py as a child: kill the Windows process tree, not just the bash job.
          taskkill //F //T //PID "$(cat /proc/$pid/winpid)" > /dev/null 2>&1 || kill "$pid" || true
          if [ "$ok" != 1 ]; then
            echo "demo did not serve the page (last status $code)"
            cat demo.log
            exit 1
          fi
